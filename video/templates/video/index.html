{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" type="text/css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="{% static 'css/display.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'css/fonts.swap.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'css/main.css' %}" rel="stylesheet" type="text/css">
    <script src="{% static 'js/jquery.slim.js' %}"></script>
    <script src="{% static 'js/ajax.jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{% static 'js/main.js' %}"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Video Downloader</a>
    </nav>
    
    <div class="container mt-4">
        <div class="card shadow-lg">
            <div class="card-header bg-success text-white text-center">
                <h2 class="card-title"><span><i class="fas fa-video"></i></span> Video Downloader</h2>
            </div>
            <div class="card-body">
                <form id="infoForm" action="{% url 'get_video_info' %}" method="post">
                    {% csrf_token %}
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="video_url" name="video_url" placeholder="Enter video URL" required>
                        <div class="input-group-append">
                            <button class="btn btn-primary" type="submit"><i class="fas fa-search"></i> Get Info</button>
                        </div>
                    </div>
                </form>

                <div id="video-info" class="mt-3" style="display:none;">
                    <img id="thumbnail" class="img-thumbnail mb-3" src="" alt="Thumbnail">
                    <h5 id="title" class="text-success"></h5>
                    <p id="uploader" class="text-muted"></p>
                    <p id="duration"></p>
                    <video id="video-preview" controls class="shadow-sm rounded">
                        <source id="video-source" src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                
                <form id="downloadForm" action="{% url 'download_video' %}" method="post">
                    {% csrf_token %}
                    <input type="hidden" id="hidden_video_url" name="video_url">
                    
                    <!-- New: Select Download Type -->
                    <div class="form-group">
                        <label for="download_type">Download Type:</label>
                        <select class="form-control" id="download_type" name="download_type">
                            <option value="video">Video</option>
                            <option value="audio">Audio</option>
                        </select>
                    </div>

                    <!-- Video Quality Selection -->
                    <div class="form-group" id="quality-group">
                        <label for="quality">Quality:</label>
                        <select class="form-control" id="quality" name="quality">
                            <option value="360">360p</option>
                            <option value="480">480p</option>
                            <option value="720">720p</option>
                            <option value="1080">1080p</option>
                        </select>
                    </div>

                    <!-- New: Audio Format Selection -->
                    <div class="form-group" id="audio-format-group" style="display:none;">
                        <label for="audio_format">Audio Format:</label>
                        <select class="form-control" id="audio_format" name="audio_format">
                            <option value="mp3">MP3</option>
                            <option value="aac">AAC</option>
                            <option value="m4a">M4A</option>
                            <option value="wav">WAV</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success btn-block"><i class="fas fa-download"></i> Download</button>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-success" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                    <div id="message" class="alert mt-3" role="alert" style="display:none;"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer with Social Media Links including X -->
<footer class="bg-light text-center text-muted py-3 mt-4">
    <div class="container">
        <div class="d-flex justify-content-center">
            <!-- Facebook -->
            <a href="https://www.facebook.com/hussan.adnan" target="_blank" class="mx-2 text-facebook">
                <i class="fab fa-facebook-f fa-lg"></i>
            </a>
            <!-- YouTube -->
            <a href="https://www.youtube.com/@adal6572" target="_blank" class="mx-2 text-youtube">
                <i class="fab fa-youtube fa-lg"></i>
            </a>
            <!-- Instagram -->
            <a href="https://www.instagram.com/yourprofile" target="_blank" class="mx-2 text-instagram">
                <i class="fab fa-instagram fa-lg"></i>
            </a>
            <!-- X (formerly Twitter) -->
            <a href="https://www.twitter.com/ceana365" target="_blank" class="mx-2 text-x">
                <i class="fab fa-x-twitter fa-lg"></i>
            </a>
            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/yourprofile" target="_blank" class="mx-2 text-linkedin">
                <i class="fab fa-linkedin-in fa-lg"></i>
            </a>
        </div>
        <p class="mt-3">© 2024 Adnan Rashed . All rights reserved.</p>
    </div>
</footer>

<!-- Font Awesome JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>

<!-- Custom CSS for Icon Colors -->
<style>
    
</style>



    

    <script>
        // Toggle quality and audio format selection based on download type
        $('#download_type').on('change', function() {
            var downloadType = $(this).val();
            if (downloadType === 'video') {
                $('#quality-group').show();
                $('#audio-format-group').hide();
            } else {
                $('#quality-group').hide();
                $('#audio-format-group').show();
            }
        });

        // Other JavaScript code remains the same...

        $('#infoForm').on('submit', function(event) {
            event.preventDefault();
            var url = $('#video_url').val();
            $.ajax({
                type: 'POST',
                url: $(this).attr('action'),
                data: {
                    'video_url': url,
                    'csrfmiddlewaretoken': '{{ csrf_token }}'
                },
                success: function(response) {
                    if (response.error) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Oops...',
                            text: response.error,
                        });
                        return;
                    }
                    $('#video-info').show();
                    $('#title').html('Title: ' + response.title);
                    $('#uploader').html('Uploader: ' + response.uploader);
                    $('#duration').html('Duration: ' + (response.duration / 60).toFixed(2) + ' minutes');
                    $('#thumbnail').attr('src', response.thumbnail);
                    $('#hidden_video_url').val(url);
                    
                    if (response.video_url) {
                        $('#thumbnail').data('video-url', response.video_url);
                    }
                },
                error: function(xhr, status, error) {
                    var errorMsg = JSON.parse(xhr.responseText).error;
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'An error occurred: ' + errorMsg,
                    });
                }
            });
        });

        $('#downloadForm').on('submit', function(event) {
            event.preventDefault();
            var formData = $(this).serialize();
            $('.progress').show();
            $.ajax({
                type: 'POST',
                url: $(this).attr('action'),
                data: formData,
                success: function(response) {
                    if (response.finished) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Download Complete!',
                            text: response.finished,
                            showConfirmButton: false,
                            timer: 1500
                        });
                        $('.progress-bar').addClass('progress-bar-success').css('width', '100%').attr('aria-valuenow', 100);
                        
                        // تأكد من أن الـ URL صحيح ويتضمن البروتوكول
                        var fileUrl = response.file_path;
                        if (!/^https?:\/\//i.test(fileUrl)) {
                            fileUrl = window.location.origin + fileUrl;
                        }
                
                        // Create a blob URL for the downloaded file
                        fetch(fileUrl)
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error('Network response was not ok.');
                                }
                                return response.blob();
                            })
                            .then(blob => {
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = response.filename || 'downloaded-file.mp4'; // استخدم اسم الملف إذا كان موجوداً
                                a.click();
                                URL.revokeObjectURL(url);
                            })
                            .catch(error => {
                                Swal.fire({
                                    icon: 'error',
                                    title: 'Oops...',
                                    text: 'حدث خطأ أثناء تحميل الملف: ' + error.message,
                                });
                            });
                    } else if (response.progress) {
                        $('.progress-bar').css('width', response.progress + '%').attr('aria-valuenow', response.progress);
                        if (response.progress === 100) {
                            $('#message').show().addClass('alert-success').text('Download complete!');
                        }
                    } else if (response.error) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Oops...',
                            text: response.error,
                        });
                    }
                },
                error: function(xhr, status, error) {
                    var errorMsg = JSON.parse(xhr.responseText).error;
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'An error occurred: ' + errorMsg,
                    });
                }
            });
        });
    </script>
</body>
</html>
